name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Build app bundle
        run: ./build.sh

      - name: Package
        run: ditto -c -k --keepParent NetSpeed.app "NetSpeed-${GITHUB_REF_NAME#v}.zip"

      - name: Create GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          gh release create "$GITHUB_REF_NAME" \
            "NetSpeed-${GITHUB_REF_NAME#v}.zip" \
            --title "$GITHUB_REF_NAME" \
            --generate-notes