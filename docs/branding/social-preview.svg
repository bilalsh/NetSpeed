<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1280 640" width="1280" height="640">
  <title>NetSpeed — GitHub social preview</title>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1B2131"/>
      <stop offset="1" stop-color="#0E121B"/>
    </linearGradient>
    <radialGradient id="glowL" cx="0.22" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#F97316" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#F97316" stop-opacity="0"/>
    </radialGradient>
    <radialGradient id="glowR" cx="0.8" cy="0.5" r="0.45">
      <stop offset="0" stop-color="#0EA5E9" stop-opacity="0.14"/>
      <stop offset="1" stop-color="#0EA5E9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2B3245"/><stop offset="1" stop-color="#151A26"/>
    </linearGradient>
    <linearGradient id="up" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#FDBA74"/><stop offset="1" stop-color="#F97316"/>
    </linearGradient>
    <linearGradient id="down" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#0EA5E9"/><stop offset="1" stop-color="#38BDF8"/>
    </linearGradient>
    <linearGradient id="join" gradientUnits="userSpaceOnUse" x1="190" y1="168" x2="365" y2="340">
      <stop offset="0" stop-color="#F97316"/><stop offset="1" stop-color="#0EA5E9"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="14" stdDeviation="16" flood-color="#000" flood-opacity="0.45"/>
    </filter>
    <filter id="tileShadow" x="-20%" y="-20%" width="140%" height="150%">
      <feDropShadow dx="0" dy="10" stdDeviation="14" flood-color="#000" flood-opacity="0.5"/>
    </filter>
  </defs>

  <rect width="1280" height="640" fill="url(#bg)"/>
  <rect width="1280" height="640" fill="url(#glowL)"/>
  <rect width="1280" height="640" fill="url(#glowR)"/>

  <!-- App icon tile, 400px, left. Tile art is 824/1024 of its canvas, so scale accordingly. -->
  <g transform="translate(150 120)">
    <g filter="url(#tileShadow)">
      <rect x="0" y="0" width="400" height="400" rx="90" fill="url(#tile)"/>
    </g>
    <rect x="0.5" y="0.5" width="399" height="399" rx="89.5" fill="none" stroke="#fff" stroke-opacity="0.10"/>
    <!-- Glyph: 556x514 art scaled 0.437 => ~243x225; centred in 400x400 tile -->
    <g transform="translate(78.5 87.5) scale(0.437)" filter="url(#shadow)">
      <path fill="url(#up)" d="M 100 8 Q 118 0 136 14 L 228 124 Q 238 140 226 154 Q 218 162 204 162 L 158 162 L 158 480 Q 158 508 118 508 Q 78 508 78 480 L 78 162 L 34 162 Q 10 162 4 146 Q 0 132 12 120 L 98 10 Z"/>
      <path fill="url(#join)" d="M 178 182 L 210 182 Q 232 178 246 158 L 252 154 L 380 328 L 338 330 Q 322 336 308 352 Z"/>
      <path fill="url(#down)" d="M 402 30 Q 402 4 440 4 Q 478 4 478 30 L 478 346 L 522 346 Q 546 348 552 364 Q 556 378 544 390 L 462 492 Q 444 514 420 498 L 336 396 Q 318 378 326 364 Q 332 348 352 346 L 402 346 Z"/>
    </g>
  </g>

  <!-- Wordmark + tagline -->
  <text x="596" y="300" font-family="-apple-system, 'SF Pro Display', 'Helvetica Neue', Arial, sans-serif"
        font-size="120" font-weight="700" fill="#FFFFFF" letter-spacing="-2">NetSpeed</text>
  <text x="600" y="365" font-family="-apple-system, 'SF Pro Text', 'Helvetica Neue', Arial, sans-serif"
        font-size="32" font-weight="400" fill="#A9B4CC">Network speed in your menu bar</text>

  <!-- Speed readout chips, echoing the real menu bar text -->
  <g font-family="'SF Mono', Menlo, Consolas, monospace" font-size="30">
    <rect x="600" y="410" width="250" height="60" rx="14" fill="#0EA5E9" fill-opacity="0.14" stroke="#0EA5E9" stroke-opacity="0.45"/>
    <text x="625" y="450" fill="#7DD3FC">↓ 1.2 MB/s</text>
    <rect x="870" y="410" width="250" height="60" rx="14" fill="#F97316" fill-opacity="0.14" stroke="#F97316" stroke-opacity="0.45"/>
    <text x="895" y="450" fill="#FDBA74">↑ 84 kB/s</text>
  </g>
</svg>
